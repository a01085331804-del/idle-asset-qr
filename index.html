<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>유휴 설비 관제</title>
<link rel="stylesheet" href="assets.css">
</head><body>
<header class="top"><div class="in">
  <h1>🏭 유휴 설비 관제</h1>
  <button class="btn sm" id="reload">새로고침</button>
  <a class="btn sm primary" href="admin.html">설비 등록 · QR 생성</a>
</div></header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="row2">
    <div class="card"><h2>상태별 현황</h2><div id="byStatus"></div></div>
    <div class="card"><h2>위치별 현황</h2><div id="byLoc"></div></div>
  </div>
  <div class="filters">
    <input id="q" placeholder="🔍 설비명 · 자산번호 · 사유 등 검색">
    <select id="fs"><option value="">전체 상태</option></select>
    <select id="fl"><option value="">전체 위치</option></select>
  </div>
  <div class="grid" id="list"></div>
  <p class="muted" id="empty" style="display:none">표시할 설비가 없습니다.</p>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let fields = [], items = [];
const F = CFG.F;

function bars(el, map, colorFn) {
  const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...arr.map(a => a[1]));
  el.innerHTML = arr.map(([k, n]) =>
    `<div class="bar"><span class="n" title="${esc(k)}">${esc(k)}</span><span class="t"><i style="width:${n / max * 100}%;background:${colorFn(k)}"></i></span><span class="c">${n}</span></div>`
  ).join('') || '<span class="muted">데이터 없음</span>';
}
const count = (arr, key) => arr.reduce((m, i) => { const k = i[key] || '(미지정)'; m[k] = (m[k] || 0) + 1; return m; }, {});

function render() {
  const total = items.reduce((s, i) => s + (Number(i[F.cost]) || 0), 0);
  const st = count(items, F.status);
  const idle = items.filter(i => i[F.status] === '유휴').length;
  $('#kpis').innerHTML = [
    ['관리 중인 설비', items.length + ' 대'],
    ['유휴 설비', idle + ' 대'],
    ['총 취득가액', won(total)],
    ['위치 수', Object.keys(count(items, F.location)).length + ' 곳']
  ].map(([l, v]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  bars($('#byStatus'), st, k => statusColor(fields, k));
  bars($('#byLoc'), count(items, F.location), () => '#2459d6');

  const q = $('#q').value.trim().toLowerCase(), fs = $('#fs').value, fl = $('#fl').value;
  const shown = items.filter(i =>
    (!fs || i[F.status] === fs) && (!fl || i[F.location] === fl) &&
    (!q || Object.values(i).join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = shown.map(i => `
    <a class="card item" href="view.html?id=${encodeURIComponent(i.ID)}">
      <div class="ph">${i[F.photo] ? `<img loading="lazy" src="${esc(i[F.photo])}" alt="">` : '사진 없음'}</div>
      <div class="bd">
        <div class="nm">${esc(i[F.name])}</div>
        <div style="margin:4px 0">${badge(fields, i[F.status])}</div>
        <div class="mt">${esc(i[F.assetNo])} · ${esc(i[F.location])}</div>
        <div class="mt">${i[F.cost] !== '' && i[F.cost] != null ? Number(i[F.cost]).toLocaleString() + ' 원' : ''}</div>
      </div></a>`).join('');
  $('#empty').style.display = shown.length ? 'none' : 'block';
}

function fillFilters() {
  const keep = [$('#fs').value, $('#fl').value];
  const f = fields.find(x => x.name === F.status);
  const sts = [...new Set([...(f ? f.options : []), ...items.map(i => i[F.status]).filter(Boolean)])];
  const locs = [...new Set(items.map(i => i[F.location]).filter(Boolean))].sort();
  $('#fs').innerHTML = '<option value="">전체 상태</option>' + sts.map(s => `<option>${esc(s)}</option>`).join('');
  $('#fl').innerHTML = '<option value="">전체 위치</option>' + locs.map(s => `<option>${esc(s)}</option>`).join('');
  $('#fs').value = keep[0]; $('#fl').value = keep[1];
}

async function load() {
  try {
    const j = await apiGet();
    fields = j.fields; items = j.items;
    fillFilters(); render();
  } catch (e) {
    document.body.insertAdjacentHTML('afterbegin', `<div class="msg err" style="margin:16px">불러오기 실패: ${esc(e.message)}</div>`);
  }
}
['#q', '#fs', '#fl'].forEach(s => $(s).addEventListener('input', render));
$('#reload').onclick = load;
if (!needSetup()) { load(); setInterval(load, 120000); }
</script>
</body></html>
