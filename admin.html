<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설비 등록 · QR 생성</title>
<link rel="stylesheet" href="assets.css?v=9">
</head><body>
<header class="top"><div class="in">
  <h1>🏷️ 설비 등록 · QR 생성</h1>
  <span class="muted" style="font-size:12px">v9</span>
  <a class="btn sm" href="index.html">관제 화면</a>
</div></header>

<main>
  <!-- 로그인 -->
  <div class="card" id="login" style="max-width:360px;margin:40px auto">
    <h2>관리자 비밀번호</h2>
    <input type="password" id="pw" placeholder="비밀번호" style="margin-bottom:8px">
    <button class="btn primary" id="loginBtn" style="width:100%">확인</button>
    <p class="muted" id="loginMsg"></p>
  </div>

  <div id="app" class="hide">
    <div class="card" style="margin-bottom:16px">
      <h2 id="formTitle">새 설비 등록</h2>
      <form id="form" class="form"></form>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="saveBtn" type="button" disabled>저장 + QR 생성</button>
        <button class="btn" id="resetBtn" type="button">+ 새 설비 등록</button>
        <span class="muted" id="status" style="align-self:center"></span>
      </div>
    </div>

    <div class="card hide" id="qrCard" style="margin-bottom:16px">
      <h2>QR 코드</h2>
      <div class="qrbox">
        <div class="q" id="qrOne"></div>
        <div>
          <div id="qrName" style="font-weight:700"></div>
          <div class="muted" id="qrUrl" style="word-break:break-all;margin:4px 0 8px"></div>
          <button class="btn sm" id="qrPdf">PDF 저장</button>
          <button class="btn sm" id="qrDl">PNG 저장</button>
          <button class="btn sm" id="qrPrint">라벨 인쇄</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <h2 style="margin:0;flex:1">등록된 설비</h2>
        <button class="btn sm" id="printSel">선택 항목 QR 인쇄</button>
        <button class="btn sm" id="printAll">전체 QR 인쇄</button>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th><input type="checkbox" id="chkAll" style="width:auto"></th><th>설비명</th><th>상태</th><th>자산번호</th><th>위치</th><th>최종수정</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</main>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js?v=9"></script>
<script src="app.js?v=9"></script>
<script>
let fields = [], items = [], pw = '', cur = null; // cur = 편집 중인 설비 (null이면 신규)
const F = CFG.F;
const store = { get: () => { try { return sessionStorage.getItem('pw') || ''; } catch (e) { return ''; } },
                set: v => { try { sessionStorage.setItem('pw', v); } catch (e) {} } };

/* ---------- 로그인 ---------- */
async function login(p) {
  $('#loginMsg').textContent = '확인 중…';
  try {
    await apiPost({ action: 'auth', password: p });
    pw = p; store.set(p);
  } catch (e) { $('#loginMsg').textContent = '❌ ' + e.message; return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#status').textContent = '설비 항목을 불러오는 중…';
  try {
    await load();
    $('#status').textContent = '';
    $('#saveBtn').disabled = false;
    const ed = new URLSearchParams(location.search).get('edit');
    if (ed) { const it = items.find(i => i.ID === ed); if (it) edit(it); }
  } catch (e) { $('#status').textContent = '❌ 불러오기 실패: ' + e.message + ' (새로고침 해주세요)'; }
}
/* 예상치 못한 오류도 화면에 표시 */
addEventListener('error', e => { const s = $('#status'); if (s) s.textContent = '❌ 오류: ' + e.message; });
addEventListener('unhandledrejection', e => { const s = $('#status'); if (s) s.textContent = '❌ 오류: ' + (e.reason && e.reason.message || e.reason); });
$('#loginBtn').onclick = () => login($('#pw').value);
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login($('#pw').value); });

/* ---------- 폼 ---------- */
function buildForm() {
  $('#form').innerHTML = fields.map((f, i) => {
    const full = f.type === 'textarea' || f.type === 'image' ? ' full' : '';
    let input;
    if (f.type === 'select') input = `<select name="${i}">${['', ...f.options].map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${i}" rows="3"></textarea>`;
    else if (f.type === 'image') input = `<input type="file" accept="image/*" capture="environment" name="${i}"><img class="hide" id="pv${i}" alt=""><div class="warn" id="pw${i}"></div>`;
    else input = `<input type="${f.type === 'date' ? 'date' : f.type === 'number' ? 'number' : 'text'}" name="${i}" ${f.type === 'number' ? 'step="any"' : ''}>`;
    return `<div class="${full}"><label>${esc(f.name)}</label>${input}</div>`;
  }).join('');
  fields.forEach((f, i) => {
    if (f.type !== 'image') return;
    $(`[name="${i}"]`).onchange = e => {
      const file = e.target.files[0];
      const w = $('#pw' + i); w.textContent = '';
      if (!file) return;
      const pv = $('#pv' + i); pv.src = URL.createObjectURL(file); pv.classList.remove('hide');
      pv.onload = () => {
        if (Math.max(pv.naturalWidth, pv.naturalHeight) < 800)
          w.textContent = `⚠️ 사진 해상도가 낮습니다 (${pv.naturalWidth}×${pv.naturalHeight}). 화면에서 작게 보입니다. 휴대폰으로 직접 찍은 원본 사진을 권장합니다.`;
      };
    };
  });
}

function fillForm(item) {
  fields.forEach((f, i) => {
    const el = $(`[name="${i}"]`);
    if (f.type === 'image') {
      el.value = '';
      const pv = $('#pv' + i), u = item && item[f.name];
      pv.onload = null; $('#pw' + i).textContent = '';
      pv.src = u || ''; pv.classList.toggle('hide', !u);
    } else el.value = item && item[f.name] != null ? item[f.name] : '';
  });
}

/* 신규/수정 모드에 따라 제목·버튼 표시 */
function setMode() {
  $('#formTitle').textContent = cur ? '✏️ 설비 수정 — ' + (cur[F.name] || cur.ID) : '새 설비 등록';
  $('#saveBtn').textContent = cur ? '✔ 수정 완료' : '저장 + QR 생성';
  document.querySelectorAll('#rows tr').forEach(tr => tr.style.background = cur && tr.dataset.id === cur.ID ? 'rgba(36,89,214,.08)' : '');
}
function edit(item) {
  cur = item;
  fillForm(item); showQR(item); setMode();
  $('#status').textContent = '내용을 고친 뒤 [✔ 수정 완료]를 누르세요.';
  scrollTo({ top: 0, behavior: 'smooth' });
}
function reset() {
  cur = null;
  fillForm(null); $('#qrCard').classList.add('hide'); $('#status').textContent = ''; setMode();
  scrollTo({ top: 0, behavior: 'smooth' });
}
$('#resetBtn').onclick = reset;

/* 사진 축소 후 업로드 */
function resize(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

$('#form').onsubmit = e => { e.preventDefault(); save(); };
$('#saveBtn').onclick = save;
async function save() {
  const btn = $('#saveBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const isEdit = !!cur;
  $('#status').textContent = isEdit ? '수정 반영 중…' : '저장 중…';
  try {
    const item = cur ? { ID: cur.ID } : {};
    for (let i = 0; i < fields.length; i++) {
      const f = fields[i], el = $(`[name="${i}"]`);
      if (f.type === 'image') {
        if (el.files[0]) {
          $('#status').textContent = '사진 업로드 중…';
          item[f.name] = (await apiPost({ action: 'upload', password: pw, name: item.ID || 'new', mime: 'image/jpeg', data: await resize(el.files[0]) })).url;
        }
      } else item[f.name] = el.value;
    }
    $('#status').textContent = isEdit ? '수정 반영 중…' : '저장 중…';
    const r = await apiPost({ action: 'save', password: pw, item });
    if (!r.item) throw new Error('서버가 저장 결과를 돌려주지 않았습니다.');
    cur = r.item;
    await load();
    fillForm(cur); showQR(cur); setMode();
    if (isEdit) {
      $('#status').textContent = `✅ 수정 완료 — 시트에 바로 반영되었습니다. (수정일시 ${cur['수정일시']}) QR은 그대로 사용하면 됩니다.`;
    } else {
      $('#status').textContent = '✅ 저장되었습니다. QR PDF를 내려받습니다.';
      savePdf(cur);
    }
  } catch (err) { $('#status').textContent = '❌ ' + err.message; alert((isEdit ? '수정' : '저장') + ' 실패: ' + err.message); }
  btn.disabled = false;
};

/* ---------- QR ---------- */
let qrObj;
function showQR(item) {
  $('#qrCard').classList.remove('hide');
  const url = itemUrl(item.ID);
  qrObj = makeQR($('#qrOne'), url, 220);
  $('#qrName').textContent = `${item[F.name] || ''} (${item[F.assetNo] || item.ID})`;
  $('#qrUrl').textContent = url;
}
$('#qrDl').onclick = () => {
  const c = $('#qrOne canvas'); const a = document.createElement('a');
  a.href = c.toDataURL('image/png'); a.download = `QR_${cur ? (cur[F.assetNo] || cur.ID) : 'qr'}.png`; a.click();
};
/* QR 라벨 PDF 저장 (한글 깨짐 방지를 위해 캔버스로 그린 뒤 PDF에 삽입) */
function savePdf(item) {
  const W = 800, H = 1000, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#999'; g.lineWidth = 4; g.setLineDash([16, 12]); g.strokeRect(10, 10, W - 20, H - 20); g.setLineDash([]);
  g.imageSmoothingEnabled = false;
  g.drawImage($('#qrOne canvas'), 70, 30, 660, 660);
  g.fillStyle = '#000'; g.textAlign = 'center';
  const fit = (t, size, y, bold) => {
    let z = size; g.font = `${bold ? 'bold ' : ''}${z}px "Malgun Gothic",sans-serif`;
    while (g.measureText(t).width > W - 80 && z > 20) { z -= 2; g.font = `${bold ? 'bold ' : ''}${z}px "Malgun Gothic",sans-serif`; }
    g.fillText(t, W / 2, y);
  };
  fit(item[F.name] || '', 56, 770, true);
  g.fillStyle = '#333';
  fit(item[F.assetNo] || item.ID, 40, 840, false);
  if (item[F.location]) fit(item[F.location], 36, 900, false);
  const pdf = new jspdf.jsPDF({ unit: 'mm', format: [80, 100] });
  pdf.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, 80, 100);
  const safe = s => String(s || '').replace(/[\/:*?"<>|]/g, '_');
  pdf.save(`QR_${safe(item[F.assetNo] || item.ID)}_${safe(item[F.name])}.pdf`);
}
$('#qrPdf').onclick = () => cur && savePdf(cur);
$('#qrPrint').onclick = () => printLabels([cur]);

function printLabels(list) {
  list = list.filter(Boolean);
  if (!list.length) return alert('인쇄할 설비를 선택하세요.');
  const area = $('#printArea'); area.innerHTML = '';
  list.forEach(it => {
    const d = document.createElement('div'); d.className = 'label';
    d.innerHTML = '<div class="q"></div><b></b><small></small>';
    makeQR(d.querySelector('.q'), itemUrl(it.ID), 170);
    d.querySelector('b').textContent = it[F.name] || '';
    d.querySelector('small').textContent = [it[F.assetNo], it[F.location]].filter(Boolean).join(' · ');
    area.appendChild(d);
  });
  setTimeout(() => print(), 300);
}
$('#printSel').onclick = () => printLabels([...document.querySelectorAll('.rowchk:checked')].map(c => items.find(i => i.ID === c.value)));
$('#printAll').onclick = () => printLabels(items);
$('#chkAll').onchange = e => document.querySelectorAll('.rowchk').forEach(c => c.checked = e.target.checked);

/* ---------- 목록 ---------- */
async function load() {
  const j = await apiGet();
  const first = !fields.length || JSON.stringify(fields) !== JSON.stringify(j.fields);
  fields = j.fields; items = j.items;
  if (first) { buildForm(); fillForm(cur); }
  $('#rows').innerHTML = items.map(i => `
    <tr data-id="${esc(i.ID)}"><td><input type="checkbox" class="rowchk" value="${esc(i.ID)}" style="width:auto"></td>
    <td><a href="view.html?id=${encodeURIComponent(i.ID)}">${esc(i[F.name])}</a></td>
    <td>${badge(fields, i[F.status])}</td><td>${esc(i[F.assetNo])}</td><td>${esc(i[F.location])}</td><td class="muted" style="white-space:nowrap">${esc(i['수정일시'])}</td>
    <td style="white-space:nowrap"><button class="btn sm" data-e="${esc(i.ID)}">수정/QR</button>
    <button class="btn sm danger" data-d="${esc(i.ID)}">삭제</button></td></tr>`).join('')
    || '<tr><td colspan="7" class="muted">등록된 설비가 없습니다.</td></tr>';
}
$('#rows').onclick = async e => {
  const eid = e.target.dataset.e, did = e.target.dataset.d;
  if (eid) edit(items.find(i => i.ID === eid));
  if (did && confirm('정말 삭제할까요? 되돌릴 수 없습니다.\n(이미 붙인 QR은 조회가 안 됩니다)')) {
    try { await apiPost({ action: 'delete', password: pw, id: did }); if (cur && cur.ID === did) reset(); await load(); }
    catch (err) { alert(err.message); }
  }
};

if (!needSetup() && store.get()) login(store.get());
</script>
</body></html>
